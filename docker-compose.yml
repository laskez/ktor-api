services:
  db:
    image: postgres:15
    container_name: ktor_db
    environment:
      POSTGRES_DB: ktor_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 4449
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ktor_api"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ktor_app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=jdbc:postgresql://db:5432/ktor_api
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=4449

volumes:
  pgdata: