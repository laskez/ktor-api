openapi: 3.0.3
info:
  title: Ktor Task API
  description: CRUD для задач с JWT-аутентификацией
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Локальный сервер

paths:
  /tasks:
    get:
      summary: Получить список задач
      tags: [Tasks]
      parameters:
        - name: done
          in: query
          description: Фильтр по статусу выполнения
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Список задач
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        "400":
          description: Некорректный параметр done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Создать задачу
      tags: [Tasks]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTask'
      responses:
        "201":
          description: Задача создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        "400":
          description: Некорректный JSON или пустой title
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Требуется токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{id}:
    get:
      summary: Получить задачу по id
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Задача найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        "400":
          description: Некорректный id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Задача не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Обновить задачу
      tags: [Tasks]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        "200":
          description: Задача обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        "400":
          description: Некорректный JSON или id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Требуется токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Задача не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Удалить задачу
      tags: [Tasks]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Задача удалена
        "400":
          description: Некорректный id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Требуется токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Задача не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register:
    post:
      summary: Регистрация пользователя
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        "201":
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        "400":
          description: Пустой логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: Логин уже занят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: Вход и получение JWT
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "401":
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Task:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Сходить погулять
        done:
          type: boolean
          example: false

    NewTask:
      type: object
      required: [title]
      properties:
        title:
          type: string
          example: Новая задача

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          example: Обновлённая задача
        done:
          type: boolean
          example: true

    RegisterRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          example: student
        password:
          type: string
          example: pass123

    RegisterResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        login:
          type: string
          example: student

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          example: student
        password:
          type: string
          example: pass123

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...

    Error:
      type: object
      properties:
        error:
          type: string
          example: Задача не найдена